<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" width="420" height="500" role="img" aria-labelledby="t d">
  <title id="t">Bidón de 20 litros de aceite de girasol alto oleico</title>
  <desc id="d">Ilustración de un bidón de polietileno de 20 litros lleno de aceite dorado, con escala de litros y etiqueta genérica.</desc>
  <defs>
    <linearGradient id="oil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c98509"/>
      <stop offset=".45" stop-color="#f2b92b"/>
      <stop offset=".7" stop-color="#f7cd55"/>
      <stop offset="1" stop-color="#c07d06"/>
    </linearGradient>
    <linearGradient id="hdpe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9e3d4"/>
      <stop offset=".5" stop-color="#fbf8f0"/>
      <stop offset="1" stop-color="#ddd5c2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="body"><rect x="70" y="120" width="270" height="330" rx="30"/></clipPath>
  </defs>
  <ellipse cx="205" cy="468" rx="160" ry="16" fill="#000" opacity=".28"/>
  <!-- asa integrada -->
  <path d="M170 124 V78 q0-22 22-22 h110 q22 0 22 22 v46" fill="none" stroke="#e4ddcc" stroke-width="22" stroke-linejoin="round"/>
  <path d="M170 124 V78 q0-22 22-22 h110 q22 0 22 22 v46" fill="none" stroke="#fbf8f0" stroke-width="10" stroke-linejoin="round" opacity=".7"/>
  <!-- boquilla y tapa -->
  <rect x="88" y="92" width="52" height="34" rx="4" fill="#e4ddcc"/>
  <rect x="82" y="70" width="64" height="30" rx="6" fill="#f2b705"/>
  <g stroke="#b88300" stroke-width="3"><path d="M92 74v22M104 74v22M116 74v22M128 74v22M140 74v22"/></g>
  <!-- cuerpo -->
  <rect x="70" y="120" width="270" height="330" rx="30" fill="url(#hdpe)"/>
  <g clip-path="url(#body)">
    <rect x="70" y="156" width="270" height="300" fill="url(#oil)" opacity=".92"/>
    <path d="M70 156 q135 -10 270 0 v8 q-135 -10 -270 0z" fill="#fde7a0" opacity=".8"/>
    <rect x="96" y="120" width="30" height="330" fill="url(#shine)" opacity=".7"/>
  </g>
  <rect x="70" y="120" width="270" height="330" rx="30" fill="none" stroke="#cfc6b1" stroke-width="3"/>
  <!-- escala de litros -->
  <g font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" font-size="15" font-weight="600" fill="#2a2418">
    <path d="M318 170h14M322 206h10M318 242h14M322 278h10M318 314h14M322 350h10M318 386h14M322 422h10" stroke="#2a2418" stroke-width="2.5"/>
    <text x="312" y="175" text-anchor="end">20</text>
    <text x="312" y="247" text-anchor="end">15</text>
    <text x="312" y="319" text-anchor="end">10</text>
    <text x="312" y="391" text-anchor="end">5</text>
  </g>
  <!-- etiqueta genérica -->
  <rect x="112" y="238" width="176" height="150" rx="6" fill="#fffdf7" stroke="#e6dcc5" stroke-width="2"/>
  <g transform="translate(200 272)">
    <g fill="#f5b70a">
      <ellipse rx="5.5" ry="15" cy="-17"/><ellipse rx="5.5" ry="15" cy="-17" transform="rotate(30)"/><ellipse rx="5.5" ry="15" cy="-17" transform="rotate(60)"/><ellipse rx="5.5" ry="15" cy="-17" transform="rotate(90)"/><ellipse rx="5.5" ry="15" cy="-17" transform="rotate(120)"/><ellipse rx="5.5" ry="15" cy="-17" transform="rotate(150)"/><ellipse rx="5.5" ry="15" cy="-17" transform="rotate(180)"/><ellipse rx="5.5" ry="15" cy="-17" transform="rotate(210)"/><ellipse rx="5.5" ry="15" cy="-17" transform="rotate(240)"/><ellipse rx="5.5" ry="15" cy="-17" transform="rotate(270)"/><ellipse rx="5.5" ry="15" cy="-17" transform="rotate(300)"/><ellipse rx="5.5" ry="15" cy="-17" transform="rotate(330)"/>
    </g>
    <circle r="11" fill="#5b3a10"/>
  </g>
  <g font-family="'Barlow Condensed','Arial Narrow',Arial,sans-serif" text-anchor="middle" fill="#17140f">
    <text x="200" y="324" font-size="15" font-weight="600" textLength="148" lengthAdjust="spacingAndGlyphs">ACEITE DE GIRASOL</text>
    <text x="200" y="344" font-size="15" font-weight="600" textLength="100" lengthAdjust="spacingAndGlyphs">ALTO OLEICO</text>
    <text x="200" y="376" font-size="26" font-weight="600">20 L</text>
  </g>
</svg>
